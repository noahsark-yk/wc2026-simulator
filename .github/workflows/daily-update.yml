name: Daily Update

# Triggers:
#   - Daily at 02:00 UTC (= 11:00 JST), after most matches finish
#   - On push to main (so manual edits to index.html etc. deploy immediately)
#   - Manual trigger from GitHub web UI for testing
on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [main]
    # Skip auto-runs on Bot's own commits to avoid loops
    paths-ignore:
      - 'scripts/elo_data.json'
      - 'scripts/match_data.json'
      - 'scripts/fifa_data.json'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for the workflow to push commits back
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      # Skip data refresh on push events (only refresh data on schedule/manual)
      # Push events just deploy whatever is already in the repo.
      - name: Determine if data refresh is needed
        id: check_event
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "refresh_data=false" >> $GITHUB_OUTPUT
            echo "Push event: skipping data refresh, just deploying"
          else
            echo "refresh_data=true" >> $GITHUB_OUTPUT
            echo "Schedule/manual event: full data refresh"
          fi
      
      - name: Fetch latest Elo ratings
        if: steps.check_event.outputs.refresh_data == 'true'
        run: node scripts/fetch_elo.js
      
      - name: Fetch match histories (all 48 teams)
        if: steps.check_event.outputs.refresh_data == 'true'
        run: node scripts/fetch_matches.js
      
      - name: Fetch latest FIFA rankings
        if: steps.check_event.outputs.refresh_data == 'true'
        run: node scripts/fetch_fifa_rank.js
      - name: Recompute atk/def values
        if: steps.check_event.outputs.refresh_data == 'true'
        run: node scripts/build_teams.js
      
      - name: Check for changes
        if: steps.check_event.outputs.refresh_data == 'true'
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain teams.json)" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if teams.json changed
        if: steps.check_event.outputs.refresh_data == 'true' && steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add teams.json scripts/elo_data.json scripts/match_data.json scripts/fifa_data.json
          git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC') from eloratings.net + football-ranking.com"
          git push
      
      # === Cloudflare Pages deployment (always runs) ===
      - name: Prepare deploy directory
        run: |
          mkdir -p _deploy
          cp index.html _deploy/
          cp teams.json _deploy/
          cp live.html _deploy/
          cp teams_frozen.json _deploy/
          cp -r data _deploy/
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _deploy --project-name=noahsark-wc2026 --branch=main
